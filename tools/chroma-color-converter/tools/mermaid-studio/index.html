<style>
  :root{
    --ink-900:#0f1116;
    --ink-800:#151821;
    --ink-700:#1c202b;
    --ink-600:#252a38;
    --line:#2e3446;
    --text:#dfe3ec;
    --text-dim:#8d95a8;
    --signal:#ffb454;
    --signal-dim:#c98a3c;
    --ok:#5fd3a6;
    --bad:#ff6b6b;
    --paper:#fbfaf6;
    --paper-grid:#dfe4ea;
    --dark-paper:#0d0f14;
    --dark-grid:#1e2432;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink-900); color:var(--text);
    font-family:var(--sans); font-size:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; gap:14px;
    padding:0 14px; height:48px; flex:0 0 48px;
    background:var(--ink-800); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:4px}
  .brand b{font-weight:650; letter-spacing:-.01em}
  .brand span{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--signal);
  }
  .spacer{flex:1}

  /* back link to the main site (hidden automatically when opened inside aashenaifi.com) */
  .backbar{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 14px;
    background:var(--ink-900); border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim)}
  .backbar a{color:var(--signal); text-decoration:none; transition:opacity .15s}
  .backbar a:hover{opacity:.75}

  label.field{display:flex; align-items:center; gap:6px}
  label.field > i{
    font-style:normal; font-family:var(--mono); font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
  }

  select, button{
    font-family:var(--sans); font-size:13px; color:var(--text);
    background:var(--ink-700); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; cursor:pointer;
    transition:border-color .12s, background .12s, color .12s;
  }
  select:hover, button:hover{border-color:#414a63}
  button:active{transform:translateY(1px)}
  button.primary{border-color:var(--signal-dim); color:var(--signal)}
  button.primary:hover{background:#2a2418; border-color:var(--signal)}
  :focus-visible{outline:2px solid var(--signal); outline-offset:2px}

  /* ---------- layout ---------- */
  main{flex:1; display:flex; min-height:0}
  .pane{display:flex; flex-direction:column; min-width:0; min-height:0}
  #editorPane{width:42%}
  #previewPane{flex:1}

  .pane-head{
    display:flex; align-items:center; gap:10px;
    height:34px; flex:0 0 34px; padding:0 12px;
    background:var(--ink-800); border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-dim);
  }
  .pane-head .tools{margin-left:auto; display:flex; gap:6px}
  .pane-head button{padding:3px 8px; font-size:12px; border-radius:5px}

  /* splitter */
  #split{
    flex:0 0 5px; cursor:col-resize; background:var(--ink-800);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  #split:hover{background:var(--signal-dim)}

  /* ---------- editor ---------- */
  .editor-wrap{flex:1; display:flex; min-height:0; background:var(--ink-900); position:relative}
  #gutter{
    flex:0 0 52px; padding:12px 8px 12px 0; overflow:hidden;
    text-align:right; user-select:none;
    font-family:var(--mono); font-size:13px; line-height:21px;
    color:#4b5265; background:var(--ink-800); border-right:1px solid var(--line);
  }
  #gutter .err{color:var(--bad); font-weight:700}
  #code{
    flex:1; padding:12px 14px; border:0; resize:none; outline:none;
    background:transparent; color:var(--text); caret-color:var(--signal);
    font-family:var(--mono); font-size:13px; line-height:21px;
    tab-size:2; white-space:pre; overflow:auto;
  }
  #code::placeholder{color:#4b5265}

  #errbar{
    flex:0 0 auto; max-height:150px; overflow:auto; display:none;
    padding:10px 14px; background:#241519; border-top:1px solid #4a2229;
    color:#ffb1b1; font-family:var(--mono); font-size:12px; line-height:1.5;
    white-space:pre-wrap;
  }
  #errbar.show{display:block}
  #errbar b{color:var(--bad); letter-spacing:.1em; font-size:10px; text-transform:uppercase; display:block; margin-bottom:4px}

  /* ---------- preview ---------- */
  #stage{
    flex:1; position:relative; overflow:hidden; min-height:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
    background-size:24px 24px;
    cursor:grab;
  }
  #stage.dark{
    background-color:var(--dark-paper);
    background-image:
      linear-gradient(var(--dark-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--dark-grid) 1px, transparent 1px);
  }
  #stage.dragging{cursor:grabbing}
  #canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
  #canvas svg{display:block; max-width:none !important; height:auto}

  #zoombar{
    position:absolute; right:12px; bottom:12px; display:flex; gap:4px;
    padding:4px; border-radius:8px;
    background:rgba(21,24,33,.9); border:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  #zoombar button{padding:4px 9px; font-size:12px; background:transparent; border:0}
  #zoombar button:hover{background:var(--ink-600)}
  #zoomval{
    align-self:center; padding:0 8px; min-width:52px; text-align:center;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
  }

  /* ---------- status ---------- */
  footer{
    flex:0 0 26px; display:flex; align-items:center; gap:14px; padding:0 14px;
    background:var(--ink-800); border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
  }
  #dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex:0 0 7px}
  #dot.ok{background:var(--ok)} #dot.bad{background:var(--bad)} #dot.busy{background:var(--signal)}
  footer .right{margin-left:auto}
  kbd{
    font-family:var(--mono); font-size:10px; padding:1px 5px;
    border:1px solid var(--line); border-radius:4px; background:var(--ink-700);
  }

  @media (max-width:820px){
    main{flex-direction:column}
    #editorPane{width:auto; height:45%}
    #split{display:none}
    header{flex-wrap:wrap; height:auto; padding:8px 12px; gap:8px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="backbar"><a href="../../index.html">← Abdullah Alshenaifi</a><span>/ tools / mermaid studio</span></div>

<header>

  <label class="field"><i>Theme</i>
    <select id="theme">
      <option value="default">default</option>

      <option value="neutral">neutral</option>

      <option value="base">base</option>

  </label>

  <label class="field"><i>Examples</i>
    <select id="samples">
      <option value="">load…</option>
    </select>
  </label>

  <div class="spacer"></div>

  <button id="copyBtn">Copy code</button>
  <button id="svgBtn">Save SVG</button>
  <button id="pngBtn" class="primary">Save PNG</button>
</header>

<main>
  <section class="pane" id="editorPane">
    <div class="pane-head">
      Code
      <div class="tools">
        <button id="fmtBtn" title="Trim trailing spaces and normalise indentation">Tidy</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
    <div class="editor-wrap">
      <div id="gutter"></div>
      <textarea id="code" spellcheck="false" autocomplete="off" placeholder="flowchart TD&#10;  A[Start] --> B[End]"></textarea>

      <div id="canvas"></div>
      <div id="zoombar">

</main>

<footer>
  <span id="dot"></span><span id="status">Loading Mermaid…</span>

<script type="module">
/* ---------------- load mermaid: local file if present, else CDN ---------------- */
let mermaid = window.mermaid;
let source = 'local file';
if (!mermaid) {
  try {
    mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
    source = 'CDN';
  } catch (e) {
    setStatus('bad', 'Mermaid failed to load — check your connection, or place mermaid.min.js next to this file.');
    throw e;
  }
}

/* ---------------- elements ---------------- */
const $ = s => document.querySelector(s);
const codeEl = $('#code'), gutter = $('#gutter'), errbar = $('#errbar');
const stage = $('#stage'), canvas = $('#canvas'), zoomval = $('#zoomval');
const dot = $('#dot'), statusEl = $('#status');

/* ---------------- examples ---------------- */
const SAMPLES = {
  'Flowchart': `flowchart TD
  A([Start]) --> B{Does it build?}
  B -- yes --> C[Run tests]
  B -- no --> D[Read the error]
  D --> E[Fix it]
  E --> B
  C --> F{All green?}
  F -- yes --> G([Ship])
  F -- no --> D`,

  'Sequence': `sequenceDiagram
  autonumber
  participant U as User
  participant A as App
  participant S as Auth server
  U->>A: Enter credentials
  A->>S: POST /token
  S-->>A: 200 access_token
  A-->>U: Open dashboard
  Note over A,S: Token kept in memory only`,

  'Class': `classDiagram
  class Device {
    +String id
    +String name
    +connect()
    +disconnect()
  }
  class Router {
    +int ports
    +route()
  }
  class Switch {
    +int vlans
  }
  Device <|-- Router
  Device <|-- Switch`,

  'State': `stateDiagram-v2
  [*] --> Idle
  Idle --> Loading : fetch()
  Loading --> Ready : 200
  Loading --> Failed : error
  Failed --> Loading : retry
  Ready --> [*]`,

  'ER diagram': `erDiagram
  CUSTOMER ||--o{ ORDER : places
  ORDER ||--|{ LINE_ITEM : contains
  PRODUCT ||--o{ LINE_ITEM : "listed in"
  CUSTOMER {
    string name
    string email
  }
  ORDER {
    int id
    date created
  }`,

  'Gantt': `gantt
  title Project plan
  dateFormat YYYY-MM-DD
  section Design
  Wireframes   :done,   d1, 2026-01-05, 5d
  UI kit       :active, d2, after d1, 7d
  section Build
  Frontend     :        b1, after d2, 14d
  QA           :crit,   b2, after b1, 5d`,

  'Pie': `pie title Where traffic comes from
  "Direct" : 45
  "Search" : 32
  "Social" : 15
  "Referral" : 8`,

  'Mindmap': `mindmap
  root((Home lab))
    Network
      VLANs
      Firewall
    Servers
      NAS
      Docker
    Media
      Streaming
      Backups`,

  'Git graph': `gitGraph
  commit id: "init"
  branch feature
  checkout feature
  commit id: "editor"
  commit id: "export"
  checkout main
  merge feature
  commit id: "v1.0"`
};

const sampleSel = $('#samples');
for (const name of Object.keys(SAMPLES)) {
  const o = document.createElement('option');
  o.value = name; o.textContent = name;
  sampleSel.appendChild(o);
}
sampleSel.addEventListener('change', () => {
  const v = sampleSel.value;
  if (!v) return;
  codeEl.value = SAMPLES[v];
  sampleSel.value = '';
  onInput(true);
});

/* ---------------- mermaid init ---------------- */
function init(theme) {
  mermaid.initialize({
    startOnLoad: false,
    theme,
    securityLevel: 'strict',
    suppressErrorRendering: true,
    fontFamily: 'ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif',
    flowchart: { htmlLabels: true, curve: 'basis' }
  });
}
init('default');

/* ---------------- render ---------------- */
let seq = 0, timer = null, firstRender = true;

function setStatus(kind, msg) {
  dot.className = kind || '';
  statusEl.textContent = msg;
}

function showError(msg) {
  errbar.innerHTML = '';
  const b = document.createElement('b'); b.textContent = 'Syntax error';
  errbar.appendChild(b);
  errbar.appendChild(document.createTextNode(msg));
  errbar.classList.add('show');
  const m = /line (\d+)/i.exec(msg);
  drawGutter(m ? parseInt(m[1], 10) : 0);
}

function clearError() {
  errbar.classList.remove('show');
  errbar.textContent = '';
  drawGutter(0);
}

async function render() {
  const code = codeEl.value.trim();
  if (!code) {
    canvas.innerHTML = '';
    clearError();
    setStatus('', 'Nothing to draw yet');
    return;
  }
  const id = 'mmd-' + (++seq);
  const mine = seq;
  setStatus('busy', 'Rendering…');
  try {
    const { svg } = await mermaid.render(id, code);
    if (mine !== seq) return;              // a newer render already ran
    canvas.innerHTML = svg;
    clearError();
    const lines = code.split('\n').length;
    setStatus('ok', `Rendered · ${lines} line${lines === 1 ? '' : 's'} · ${code.split(/\s+/)[0]}`);
    if (firstRender) { fit(); firstRender = false; }
  } catch (err) {
    if (mine !== seq) return;
    document.getElementById('d' + id)?.remove();   // mermaid's temp node
    document.getElementById(id)?.remove();
    setStatus('bad', 'Diagram has an error');
    showError(String(err && err.message ? err.message : err).trim());
  }
}

function onInput(immediate) {
  drawGutter(currentErrLine);
  clearTimeout(timer);
  timer = setTimeout(render, immediate ? 0 : 350);
}

codeEl.addEventListener('input', () => onInput(false));
codeEl.addEventListener('scroll', () => { gutter.scrollTop = codeEl.scrollTop; });

codeEl.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeEl.selectionStart, t = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, s) + '  ' + codeEl.value.slice(t);
    codeEl.selectionStart = codeEl.selectionEnd = s + 2;
    onInput(false);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveSVG(); }
});

/* ---------------- gutter ---------------- */
let currentErrLine = 0;
function drawGutter(errLine) {
  currentErrLine = errLine || 0;
  const n = codeEl.value.split('\n').length;
  let html = '';
  for (let i = 1; i <= n; i++) {
    html += (i === currentErrLine) ? `<div class="err">${i}</div>` : `<div>${i}</div>`;
  }
  gutter.innerHTML = html;
  gutter.scrollTop = codeEl.scrollTop;
}

/* ---------------- zoom & pan ---------------- */
let scale = 1, tx = 0, ty = 0;
function applyTransform() {
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomval.textContent = Math.round(scale * 100) + '%';
}
function zoomAt(cx, cy, factor) {
  const next = Math.min(8, Math.max(0.1, scale * factor));
  const k = next / scale;
  tx = cx - k * (cx - tx);
  ty = cy - k * (cy - ty);
  scale = next;
  applyTransform();
}
function fit() {
  const svg = canvas.querySelector('svg');
  if (!svg) return;
  const vb = svg.viewBox?.baseVal;
  const w = vb && vb.width ? vb.width : svg.getBoundingClientRect().width;
  const h = vb && vb.height ? vb.height : svg.getBoundingClientRect().height;
  if (!w || !h) return;
  const pad = 40;
  const r = stage.getBoundingClientRect();
  scale = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 2);
  tx = (r.width - w * scale) / 2;
  ty = (r.height - h * scale) / 2;
  applyTransform();
}

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

let panning = false, px = 0, py = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#zoombar')) return;
  panning = true; px = e.clientX; py = e.clientY;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!panning) return;
  tx += e.clientX - px; ty += e.clientY - py;
  px = e.clientX; py = e.clientY;
  applyTransform();
});
const endPan = () => { panning = false; stage.classList.remove('dragging'); };
stage.addEventListener('pointerup', endPan);
stage.addEventListener('pointercancel', endPan);

$('#zoomIn').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.2); };
$('#zoomOut').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.2); };
$('#fitBtn').onclick = fit;
$('#resetBtn').onclick = () => { scale = 1; tx = 20; ty = 20; applyTransform(); };

/* ---------------- export ---------------- */
function exportableSVG() {
  const svg = canvas.querySelector('svg');
  if (!svg) return null;
  const clone = svg.cloneNode(true);
  const vb = svg.viewBox?.baseVal;
  const w = vb && vb.width ? vb.width : svg.getBoundingClientRect().width;
  const h = vb && vb.height ? vb.height : svg.getBoundingClientRect().height;
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.style.maxWidth = 'none';
  return { markup: new XMLSerializer().serializeToString(clone), w, h };
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function saveSVG() {
  const out = exportableSVG();
  if (!out) return setStatus('bad', 'Draw a diagram first');
  download(new Blob([out.markup], { type: 'image/svg+xml;charset=utf-8' }), `diagram-${stamp()}.svg`);
  setStatus('ok', 'SVG saved');
}

function savePNG() {
  const out = exportableSVG();
  if (!out) return setStatus('bad', 'Draw a diagram first');
  const factor = 3;
  const img = new Image();
  const b64 = btoa(unescape(encodeURIComponent(out.markup)));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = Math.round(out.w * factor);
    c.height = Math.round(out.h * factor);
    const ctx = c.getContext('2d');
    ctx.fillStyle = $('#theme').value === 'dark' ? '#0d0f14' : '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => {
      download(b, `diagram-${stamp()}.png`);
      setStatus('ok', `PNG saved · ${c.width}×${c.height}px`);
    }, 'image/png');
  };
  img.onerror = () => setStatus('bad', 'PNG export failed — save as SVG instead');
  img.src = 'data:image/svg+xml;base64,' + b64;
}

$('#svgBtn').onclick = saveSVG;
$('#pngBtn').onclick = savePNG;
$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(codeEl.value); setStatus('ok', 'Code copied'); }
  catch { setStatus('bad', 'Clipboard blocked — select the text and copy manually'); }
};
$('#clearBtn').onclick = () => { codeEl.value = ''; codeEl.focus(); onInput(true); };
$('#fmtBtn').onclick = () => {
  codeEl.value = codeEl.value
    .split('\n').map(l => l.replace(/\s+$/, '').replace(/\t/g, '  ')).join('\n')
    .replace(/\n{3,}/g, '\n\n').trim();
  onInput(true);
};

/* ---------------- theme ---------------- */
$('#theme').addEventListener('change', e => {
  const t = e.target.value;
  stage.classList.toggle('dark', t === 'dark');
  init(t);
  render();
});

/* ---------------- splitter ---------------- */
const splitEl = $('#split'), editorPane = $('#editorPane');
splitEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  splitEl.setPointerCapture(e.pointerId);
  const move = ev => {
    const total = document.querySelector('main').getBoundingClientRect().width;
    const pct = Math.min(75, Math.max(20, (ev.clientX / total) * 100));
    editorPane.style.width = pct + '%';
  };
  const up = () => {
    splitEl.removeEventListener('pointermove', move);
    splitEl.removeEventListener('pointerup', up);
  };
  splitEl.addEventListener('pointermove', move);
  splitEl.addEventListener('pointerup', up);
});

/* ---------------- boot ---------------- */
codeEl.value = SAMPLES['Flowchart'];
drawGutter(0);
applyTransform();
await render();
setStatus('ok', `Ready · Mermaid loaded from ${source}`);
window.addEventListener('resize', () => { if (!firstRender) return; fit(); });
</script>
</body>
</html>
